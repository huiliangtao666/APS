<!doctype html><html><meta charset="utf-8"><title>AXIS-LABEL-03 before/after viewport comparison</title><style>body{margin:0;background:#eee}iframe{display:block;border:0;height:820px}</style><label>Component <select id="version" onchange="refresh()"><option>after</option><option>before</option></select></label><label>Actual iframe viewport <select id="viewport" onchange="refresh()"><option>1100</option><option>640</option></select></label><iframe id="case" title="Component browser viewport" width="1100" src="after.html"></iframe><script>function refresh(){const f=document.querySelector('iframe');f.width=document.querySelector('#viewport').value;f.src=document.querySelector('#version').value+'.html'}</script></html>

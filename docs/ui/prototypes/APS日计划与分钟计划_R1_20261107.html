 const pages=Math.max(1,Math.ceil(all.length/p.size));p.page=Math.min(p.page,pages);const visible=columns.filter(c=>c.required||p.cols.includes(c.k));views[id]={columns,rows:all,opts};

function dataView(){let data=materials.map(([id,name],i)=>({id,name,material:id,kind:['成品','半成品','原料','包材'][i],source:i===0?'DG独立业务夹具':'结构示意，非DG实际实耗证明',quantity:ctx.scene==='S07'&&i===0?'实际合格98 / 已发30 / 在库68':'按所选场景原输入，不在此累加',date:'2026-11-01'}));return viewTable('DP-data',[{k:'id',t:'物料编号',required:true,render:r=>btn(r.id,'source',r.id,'link')},{k:'name',t:'仿真业务名称'},{k:'kind',t:'类别'},{k:'quantity',t:'数量/资格'},{k:'source',t:'来源范围'}],filtered(data),{title:'共享业务底本 · 模式切换不复制库存'})+notice('物料/BOM扩展示意用于展示筛选语义，不证明关联产品均受影响，不增加需求或扣库存。')}
function simView(){let s=ctx.sim;return `<div class="metrics">${metric('原业务底本实库','68kg','green')}${metric('回放分支', 'SIM-B'+s.branch)}${metric('回放原料',s.raw+'kg')}${metric('回放成品',s.fg+'kg',s.fg?'green':'gold')}${metric('回放检查点',s.day?'CP1 已提交':'CP0 期初')}</div>`+notice('独立S07数量回放：原业务底本68kg保持。回放分支不并回实账，不写APS，不调用模拟器主程序。')+`<div class="row">${btn('提交一次日结','sim-commit','','primary')}${btn('下一日结注入失败','sim-fail')}${btn('从CP0恢复新回放分支','sim-restore')}${btn('历史分支','sim-history')}<span class="small">${s.fail?'已设置失败注入；提交失败应保CP0':'100投入=98合格+2损耗；98=30发运+68在库'}</span></div>`+(s.error?notice(esc(s.error),'error'):'')+viewTable('DP-ledger',[{k:'id',t:'同一事实身份',required:true},{k:'type',t:'事实'},{k:'qty',t:'累计kg',num:true},{k:'delta',t:'再次重放新增kg',num:true}],[{id:'S07-CONSUME100',type:'累计投料',qty:s.day?100:0,delta:0},{id:'S07-OUTPUT98',type:'累计合格产出',qty:s.day?98:0,delta:0},{id:'S07-SCRAP2',type:'累计损耗',qty:s.day?2:0,delta:0},{id:'S07-SHIP30',type:'累计发运',qty:s.day?30:0,delta:0}],{title:'独立回放账 · 幂等累计身份'})}
function render(){closeMenu();let p=plan();$('top-mode').innerHTML=['day','minute'].map(m=>btn(modeName(m),'mode',m,ctx.mode===m?'active':'',`aria-pressed="${ctx.mode===m}"`)).join('');$('nav').innerHTML=[['work','排程工作台'],['mps','生产主计划'],['load','资源负荷'],['data','业务数据'],['versions','计划版本'],['sim','仿真回放']].map(([id,name])=>btn(name,'nav',id,ctx.page===id?'active':'')).join('');$('app').innerHTML=`<div class="title-row"><h1>${modeName()} · ${esc({work:'排程工作台',mps:'生产主计划',load:'资源负荷',data:'业务数据',versions:'计划版本',sim:'仿真回放'}[ctx.page])}</h1><span class="sub">日期与数量计划 / 日内工序与多资源排程</span><span class="spacer"></span>${btn('操作导览','guide','','link')}</div>`+contextBlock()+topControls()+(ctx.page==='versions'?versionView():ctx.page==='sim'?simView():filterBar('DP',filters.DP.defs.filter(d=>!['data','mps'].includes(ctx.page)||d.id!=='resource'),`<label class="switch"><input type="checkbox" data-bom ${filters.DP.bom?'checked':''}>根据BOM显示</label>`)+(ctx.page==='work'?summary()+issuesBox()+operations()+configuration()+(ctx.view==='aggregate'&&ctx.mode==='minute'?btn('返回分钟任务','aggregate','','link')+dailySupply():chart()+taskTable()):ctx.page==='mps'?issuesBox()+dailySupply():ctx.page==='load'?loadView():dataView()));renderDrawer();renderModal();document.title=modeName()+' · APS双能力交互原型'}

function guard(fn){if(!ctx.dirty){fn();return}ctx.pending=fn;showModal('未保存的本次条件',notice('切换不能静默丢弃编辑。保存会形成新候选，不修改原版本。'),btn('继续编辑','closeModal')+btn('放弃编辑并切换','discard-switch')+btn('保存新候选并切换','save-switch','','primary'))}
function saveEdit(){let v=ctx.edit;if(!v)return false;if(v.minutes!==''&&(!Number.isInteger(Number(v.minutes))||Number(v.minutes)<=0)){toast('运行分钟须为正整数，空值表示未知',true);return false}newDraft(ctx.mode,v,plan().id);return true}
actions['mode']=m=>guard(()=>{ctx.mode=m;ctx.view='native';drawer=null;modal=null;render()});actions['nav']=page=>guard(()=>{ctx.page=page;if(page==='sim')ctx.scene='S07';ctx.view='native';render()});
actions['discard-switch']=()=>{let fn=ctx.pending;ctx.edit=null;ctx.dirty=false;ctx.pending=null;closeModal();fn()};actions['save-switch']=()=>{let fn=ctx.pending;if(saveEdit()){ctx.pending=null;closeModal();fn()}};
actions['save-config']=()=>{if(!ctx.dirty){toast('没有待保存的条件变化');return}if(saveEdit()){render();toast('已保存新候选；原版本和结果保持，需重新运行')}};actions['discard-config']=()=>{ctx.edit=null;ctx.dirty=false;render()};
actions['run']=()=>{if(ctx.dirty){toast('请先保存为新候选，不能用未保存条件覆盖旧结果',true);return}let p=plan(),c=state();if(p.fact!==c.rev){toast('当前事实已变化，请派生新候选后再计算',true);return}if(p.result?.ready){p=newDraft(ctx.mode,p.params,p.id)}let result=calculate(p);if(!result.ready){p.result=result;p.status='待补条件';render();toast('条件缺项，未开始计算；没有回退到日模式',true);return}let sc=ctx.scene;p.status='计算中';let token=++ctx.serial;p.job=token;ctx.jobCount++;render();setTimeout(()=>{if(p.job!==token)return;p.result=result;p.status='示例已保存';render();toast('DG-'+sc+' '+modeName(p.mode)+'规则示例完成；没有调用实际APS引擎')},430)};
actions['adopt']=()=>{if(ctx.dirty){toast('请先保存或放弃未提交条件，不能采用旧条件掩盖编辑',true);return}let p=plan(),c=state();if(!p.result?.ready||!p.result.eligible||p.fact!==c.rev){toast('未就绪、有关键问题或候选过期，不可采用',true);return}showModal('采用此版本（独立原型）',kv([['原采用',c.adopted?.id||'无'],['新采用',p.id],['粒度/用途',p.mode==='day'?'日级计划基线；日内资格未验证':'所列分钟规则示例，不是产品可执行证明'],['库存/采购','只替换唯一采用引用，不发生投料或采购']]),btn('放弃','closeModal')+btn('确认采用','confirm-adopt',p.id,'primary'))};
actions['confirm-adopt']=id=>{let p=allPlans().find(x=>x.id===id);if(!p||p.fact!==state().rev||!p.result?.eligible){closeModal();toast('候选过期或不具备采用条件',true);return}state().adopted={id:p.id,mode:p.mode,scope:p.mode==='day'?'日级计划基线':'分钟规则示例'};closeModal();render();toast('当前场景唯一采用引用已更新；没有重复实账交易')};
actions['derive']=()=>guard(()=>{let parent=plan(),m=ctx.mode==='day'?'minute':'day',v=clone(parent.params);if(ctx.scene==='S08'&&m==='minute'){v.minutes='';v.release=''}showModal('派生关联新候选',kv([['来源',parent.id],['目标粒度',modeName(m)],['处理','创建新版本；不会自动计算、采用或把一天补成1440加工分钟'],['日汇总区别','分钟结果只读日汇总无需新日run；本动作明确创建独立日候选']]),btn('取消','closeModal')+btn('创建候选','confirm-derive','','primary'));actions['confirm-derive']=()=>{newDraft(m,v,parent.id);ctx.mode=m;ctx.view='native';closeModal();render();toast('已创建关联候选，需运行本模式规则示例')}});
actions['recovery']=()=>{if(ctx.dirty){toast('请先保存或放弃未提交条件，再另建恢复候选',true);return}let p=plan(),v=clone(p.params),s=ctx.scene;if(s==='S02')v.restored=true;if(s==='S03')v.release='14:30';if(s==='S06'){v.resume='14:00';v.exception=true}if(s==='S08'){v.minutes=17;v.release='08:24'}showModal('显式变更 · 另建候选',notice('原输入、原候选和旧结果保留。以下条件仅用于本独立场景的新候选，不修改共享P。')+kv([['场景',s],['变更',s==='S02'?'B开工窗由08:10—08:15显式改为08:24；不声称原窗口可行':s==='S03'?'有来源的新放行修订14:30':s==='S06'?'显式14:00恢复及冻结例外；仅续剩余60，工具后延10分钟':s==='S08'?'明确P运行17分钟及08:24放行；原缺项版本不变':'无'],['下一步','保存新候选后需点击运行，不能继承旧解当新结果']]),btn('取消','closeModal')+btn('确认新候选','confirm-recovery','','primary'));actions['confirm-recovery']=()=>{newDraft(ctx.mode,v,p.id);closeModal();render()}};
actions['unknown']=()=>{if(ctx.dirty){toast('请先保存或放弃未提交条件',true);return}let p=plan(),v=clone(p.params);v.release='';newDraft(ctx.mode,v,p.id);render();toast('新候选合格时点未知；旧16:00版本保留，不补00:00')};
actions['stale']=()=>{state().rev++;render();toast('当前事实修订已更新；旧候选保留但采用检查失效')};
actions['aggregate']=()=>{ctx.view=ctx.view==='aggregate'?'native':'aggregate';render()};
actions['source']=()=>showDrawer('数据来源与版本身份',()=>provenance());actions['plan-detail']=id=>{let p=allPlans().find(p=>p.id===id)||plan();showDrawer('计划版本 · '+p.id,()=>provenance(p))};
actions['open-plan']=id=>guard(()=>{let p=allPlans().find(x=>x.id===id);ctx.mode=p.mode;state()[ctx.mode].selected=id;ctx.page='work';render()});
actions['task']=id=>{let p=plan(),r=p.result,t=(r?.tasks||[]).find(t=>t.id===id)||(r?.rows||[]).find(t=>t.id===id);if(!t){toast('该记录没有所给工序细节');return}showDrawer('任务与批次 · '+id,tab=>tab==='source'?provenance(p):tab==='resource'?kv([['主设备',resources[t.resource]||t.resource],['人员','P01；只有场景明确给定的参与范围可推负荷'],['工具','S06 TOOL01不自动归还；其余按场景输入，未提供不补']]):tab==='risk'?notice(ctx.scene==='S03'?'合格时点与客户截止分别校验，日同日不能承诺满足。':'仅采用本独立夹具所声明的供给与资格，不能推定整月完整路线通过。','warn'):tab==='relation'?notice('按所给实际任务关系查看；本独立夹具没有完整肉食品BOM路线，未提供前后序不伪造。'):kv([['计划',p.id+' / '+modeName(p.mode)],['任务/业务',esc(t.name)],['生产时间',p.mode==='minute'&&t.start!==undefined?stamp(t.start)+'—'+stamp(t.end)+'（结束排他）':'日期2026.11.01；日内时分未由日模型证明'],['真实时长',p.mode==='minute'&&t.start!==undefined?(t.end-t.start)+'分钟':t.load!==undefined?fmt(t.load)+'分钟已知整批工时':'未知'],['数量',t.qty===null?'产出未知，不把WIP当合格量':fmt(t.qty)+'kg（按所列计划或事实分类）']] ),[['main','任务明细'],['relation','前后工序'],['resource','资源需求'],['risk','物料风险'],['source','数据来源']])};
actions['supply']=date=>showDrawer('日供给来源 · '+date,()=>kv([['来源run',plan().id+' / '+modeName()],['日期归属',date],['口径',ctx.scene==='S04'?'加工23:50—00:10；00:15整批合格20kg，只在11.02供给一次':ctx.scene==='S05'?'工时20全部在11.01；00:00合格20kg归11.02':ctx.scene==='S03'?'预计到货合格供给20kg，非新制造；日净额不证明日内按期':'独立场景的明确合格节点'],['版本关系','日汇总不新增日run；原始计划和真实分钟仍保留'],['来源',btn('完整来源','source','','link')]]));
actions['sim-fail']=()=>{if(ctx.sim.day){toast('本夹具已提交CP1；请先从CP0恢复新分支再注入失败');return}ctx.sim.fail=true;render();toast('设置下一次回放日结失败；实际业务底本仍不变')};
actions['sim-commit']=()=>{let s=ctx.sim;if(s.day){toast('同身份已提交：回原检查点，新增投料/产出/发运均0');return}if(s.fail){s.fail=false;s.error='提交前失败：CP0、原料100/成品0保留；可以重试。';render();return}s.day=1;s.raw=0;s.fg=68;s.error='';render();toast('已原子提交独立回放CP1：100=98+2，98=30+68')};
actions['sim-restore']=()=>{let s=ctx.sim;s.history.push({id:'SIM-B'+s.branch,cp:s.day?'CP1':'CP0',raw:s.raw,fg:s.fg});s.branch++;s.day=0;s.raw=100;s.fg=0;s.error='';s.fail=false;render();toast('恢复到新隔离回放分支，原分支保留，不回并业务底本')};
actions['sim-history']=()=>showDrawer('历史回放分支',()=>viewTable('DP-sim-history',[{k:'id',t:'分支',required:true},{k:'cp',t:'检查点'},{k:'raw',t:'原料kg',num:true},{k:'fg',t:'成品在库kg',num:true}],ctx.sim.history,{title:'恢复不擦除旧分支'}));
actions['guide']=()=>showModal('推荐体验顺序',`<ol><li>在抬头栏切“日计划/分钟计划”，观察版本、检查范围和采用引用。</li><li>选S02：看47≤480的日聚合与P01分钟冲突；另建恢复候选后再运行。</li><li>选S04或S05：查看资源负荷和生产主计划，核工时拆日、合格量只记一次。</li><li>选S08：从日派生分钟候选，试缺项阻断，再补条件运行；日汇总不产生新日版本。</li><li>在“仿真回放”试失败、重试、新分支及库存不重复记量。</li></ol>`+notice('所有计算/采用/导出为独立原型示例；不调用实际求解器，不表示APS实现/UAT通过。'));
actions['reset-demo']=()=>confirmDemo('重置此原型','重新加载内置版本和回放；只影响此原型。',()=>location.reload());

actions['cancel-run']=()=>{let p=plan();if(p.status!=='计算中')return;p.job=++ctx.serial;p.status='已取消';p.result=null;render();toast('本候选示例已取消，旧版本及已采用引用保留')};

actions.columns=(id,el)=>{if(menu?.kind==='columns'&&menu.id===id){closeMenu();return}openColumns(id,el)};
actions.pick=(v,el)=>{let [owner,id]=v.split('|');if(menu?.kind==='pick'&&menu.id===id&&menu.owner===owner){closeMenu();return}menu={kind:'pick',owner,id,anchor:el,rect:el.getBoundingClientRect(),search:''};renderMenu();$('menu-search')?.focus()};actions.menuAll=()=>menuBulk('all');actions.menuSearchAll=()=>menuBulk('search');actions.menuNone=()=>menuBulk('none');
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(menu&&!e.target.closest('.menu')&&!['pick','columns'].includes(el?.dataset.action))closeMenu();if(el){e.preventDefault();if(el.disabled)return;let fn=actions[el.dataset.action];if(fn)try{fn(el.dataset.value||'',el)}catch(error){toast('原型动作未完成：'+error.message,true);console.error(error)}}if(e.target.dataset.backdrop==='modal')closeModal()});
function editField(el){if(!el.dataset.edit)return;if(!ctx.dirty)ctx.edit=clone(plan().params);ctx.dirty=true;ctx.edit[el.dataset.edit]=el.type==='checkbox'?el.checked:el.value;let s=document.querySelector('.config summary');if(s)s.innerHTML='本次条件与版本覆盖 <b class="dirty">有未保存编辑</b>'}
document.addEventListener('input',e=>{let el=e.target;if(el.id==='menu-search'&&menu){let caret=el.selectionStart;menu.search=el.value;renderMenu();$('menu-search').focus();$('menu-search').setSelectionRange(caret,caret)}else editField(el)});
document.addEventListener('change',e=>{let el=e.target;if(el.hasAttribute('data-menu-choice')){changeMenu(el.dataset.menuChoice,el.checked);return}if(el.dataset.tableSize){let p=tablePrefs[el.dataset.tableSize];p.size=num(el.value,100);p.page=1;render();return}if(el.hasAttribute('data-bom')){filters.DP.bom=el.checked;Object.values(tablePrefs).forEach(p=>p.page=1);render();return}if(el.hasAttribute('data-scene')){let target=el.value;el.value=ctx.scene;guard(()=>{ctx.scene=target;if(ctx.page==='sim'&&target!=='S07')ctx.page='work';ctx.edit=null;ctx.dirty=false;ctx.view='native';drawer=null;modal=null;render()});return}if(el.hasAttribute('data-version')){let target=el.value;el.value=plan().id;guard(()=>{state()[ctx.mode].selected=target;ctx.view='native';render()});return}editField(el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(menu)closeMenu();else if(modal)closeModal();else if(drawer)closeDrawer()}});
let drag=null;document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-drag]')&&drawer){drag={sx:e.clientX,sy:e.clientY,x:drawer.x||0,y:drawer.y||0};e.preventDefault()}});document.addEventListener('pointermove',e=>{if(!drag||!drawer)return;drawer.x=Math.max(-window.innerWidth+420,Math.min(20,drag.x+e.clientX-drag.sx));drawer.y=Math.max(-40,Math.min(window.innerHeight-180,drag.y+e.clientY-drag.sy));let el=document.querySelector('.drawer');if(el)el.style.transform=`translate(${drawer.x}px,${drawer.y}px)`});document.addEventListener('pointerup',()=>drag=null);window.addEventListener('resize',closeMenu);
window.Prototype={ctx,state,plan,allPlans,calculate,filtered,actions,filters,views,tablePrefs,render,getModal:()=>modal};render();

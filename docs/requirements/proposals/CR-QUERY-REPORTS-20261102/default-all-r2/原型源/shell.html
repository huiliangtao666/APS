<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APS · 业务查询工作台（讨论原型）</title>
<!--STYLE--></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">A</span><span>APS <small>计划协同</small></span></div><div class="workspace">业务查询工作台 <span>原型 R3</span></div><nav id="nav" aria-label="查询导航"></nav><div class="side-note"><b>业务查询原型</b><p>使用上传的肉食品仿真数据。<br>页面交互仅作用于本原型。</p></div><div class="side-bottom">日粒度 · 默认开始 2026.11.01<br>真实期初 2026.10.31</div></aside>
<section class="main"><header class="topbar"><div><span class="crumb">APS / 业务查询</span><h1 id="title">物料 BOM 查询</h1></div><div class="header-actions"><span class="prototype">讨论原型 · 未接入主程序</span><button data-action="rules">取数与口径</button></div></header>
<div class="snapshot"><div><span class="dot"></span><b>仿真输入快照 · 筛选默认全选</b><span>B：业务数据文件</span><span>P：第二份配置文件优先</span><button class="text-button" data-action="sources">查看来源</button></div><label>结果口径 <select id="basis" aria-label="结果口径"><option value="input">输入数据（无排程占用结果）</option><option value="demo">演示计划 RP001（设计构造）</option></select></label></div>
<div class="content"><p id="intro" class="intro"></p><div class="filter-card"><form id="filters" autocomplete="off"></form></div><div id="stats" class="stats"></div><div id="subtabs" class="subtabs"></div><div id="notice" class="notice"></div><div id="visual"></div><section class="report"><div class="report-head"><div><b id="reportTitle"></b><span id="resultCount"></span></div><div class="tools"><label id="unitControl"></label><button id="columns" data-action="columns">栏位</button><button data-action="export">导出筛选结果 CSV</button></div></div><div id="tableHost" class="table-host"></div><div class="pager"><span id="pageInfo"></span><div><label>每页 <select id="pageSize" aria-label="每页行数"><option>100</option><option>200</option><option>500</option></select> 行</label><button data-action="prev">上一页</button><span id="pageNo"></span><button data-action="next">下一页</button></div></div></section><div class="bottom-note"><span id="footnote"></span><button class="text-button" data-action="params">查看本页关联参数 →</button></div></div>
</section></div>
<div id="shade" class="shade" hidden></div><aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="查询明细" hidden><header><div><span id="drawerKicker">明细追溯</span><h2 id="drawerTitle"></h2></div><button data-action="close" aria-label="关闭明细">✕</button></header><div id="drawerBody" class="drawer-body"></div></aside><div id="toast" class="toast" role="status" hidden></div>

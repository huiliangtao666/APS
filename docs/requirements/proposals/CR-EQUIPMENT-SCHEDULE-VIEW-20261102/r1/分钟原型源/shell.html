<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分钟版 · APS · 设备排程展示原型</title><!--STYLE--></head><body>
<div class="layout"><aside class="rail"><div class="logo">A</div><button title="设备排程" class="chosen" data-action="view" data-ref="gantt">▥</button><button title="数据来源" data-action="sources">◈</button><button title="显示口径" data-action="rules">ⓘ</button><span>APS</span></aside><main class="workspace-main">
<header class="app-head"><div class="heading"><b>设备排程</b><span>生产计划 / 图形看板</span></div><div class="head-right"><span class="demo-label">设计演示 · 非APS求解结果</span><label>方案 <select id="planSelect" aria-label="展示方案"><option value="DEMOA">演示方案 A</option><option value="DEMOB">调整演示 B（含冲突）</option></select></label><button data-action="sources">来源</button></div></header>
<section class="filters-panel"><form id="filters"></form></section><nav id="views" class="views" aria-label="排程展示视图"></nav>
<section class="pulse"><div id="metrics"></div><span id="selectionHint">点击任务可追溯工序、物料和资源</span></section>
<section class="board"><div class="board-toolbar"><div class="board-left"><strong id="viewTitle">设备甘特</strong><span id="scopeTitle"></span></div><div class="board-tools"><button data-action="prev-window" title="前一日期窗口">‹</button><button data-action="next-window" title="后一日期窗口">›</button><label>窗口 <select id="windowDays"><option value="1">1天</option><option value="7">7天</option><option value="14" selected>14天</option><option value="28">28天</option></select></label><label>刻度 <select id="timeScale"><option value="overview">日期总览</option><option value="halfHour">半小时</option></select></label><label>行高 <select id="density"><option value="fit">一屏总览</option><option value="compact">紧凑</option><option value="normal">标准</option></select></label><label id="colorControl">配色 <select id="colorBy"><option value="product">按产品</option><option value="state">按状态</option></select></label><label id="metricControl" hidden>口径 <select id="metric"><option value="slot">日槽位占用</option><option value="kg">投产量/日能力</option></select></label><label id="auxControl" hidden>资源 <select id="auxKind"><option value="crew">班组人数峰值</option><option value="tool">工装并发峰值</option></select></label><label class="check-compact" id="dependencyControl"><input id="dependencies" type="checkbox" checked>工序链</label><button data-action="columns">栏位</button><button data-action="export">导出</button><button data-action="focus" title="收起顶部筛选，扩大图形区域">专注</button></div></div><div id="surface" class="surface"></div><div class="board-bottom"><div id="legend"></div><div class="paging"><label>每页 <select id="pageSize"><option>100</option><option>200</option><option>500</option></select></label><span id="pageInfo"></span><button data-action="prev">‹</button><button data-action="next">›</button></div></div></section>
<footer class="app-foot"><span>原件设备与工艺 · 任务及风险为设计夹具</span><span>日期为日历日期 · 选中任务高亮同需求工序 · <button class="text-button" data-action="rules">口径说明</button></span></footer>
</main></div>
<div id="shade" class="shade" hidden></div><aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="排程明细" hidden><header><div><span id="drawerKicker">明细溯源</span><h2 id="drawerTitle"></h2></div><button data-action="close" aria-label="关闭明细">✕</button></header><div id="drawerBody" class="drawer-body"></div></aside><div id="tooltip" class="tooltip" role="tooltip" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<!--DATA--><!--SCRIPTS--></body></html>

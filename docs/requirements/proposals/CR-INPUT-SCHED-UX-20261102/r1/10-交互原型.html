<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APS 输入与排程 · 设计原型 r1</title>
<style>
:root{--ink:#17332f;--muted:#5c706b;--line:#dce5df;--paper:#f4f6f1;--green:#145e50;--pale:#e3efe6;--amber:#8a5308;--red:#a52e34;--purple:#695182}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #bdcec5;border-radius:7px;background:white;color:var(--ink);padding:8px 13px}button:hover:not(:disabled){background:#edf5ef}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d48c28;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover:not(:disabled){background:#1e7562}.link{border:0;background:transparent;text-decoration:underline;color:var(--green);padding:3px 0}input,select{padding:8px;border:1px solid #b4c8bd;border-radius:6px;max-width:100%;background:white;color:var(--ink)}label{display:block;font-size:13px;color:var(--muted);margin:10px 0}label input,label select{display:block;width:100%;margin-top:4px}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.sidebar{background:#163b33;color:#ecf4e9;padding:28px 18px;position:sticky;top:0;height:100vh}.brand{font-size:26px;font-weight:750;letter-spacing:3px}.side-note{color:#b6d1c4;font-size:12px}.sidebtn{display:block;width:100%;text-align:left;margin:12px 0;color:#d4e5d9;background:transparent;border:0;padding:11px}.sidebtn.active{background:#31574a;color:white}.sidebtn:hover:not(:disabled){background:#31574a}.sidebar footer{margin-top:38px;font-size:12px;color:#c1d8c9}.main{max-width:1390px;width:100%;padding:30px 38px 60px;margin:auto}.eyebrow{font-size:12px;letter-spacing:2px;color:#6d8276}h1{font-size:30px;line-height:1.3;margin:7px 0 12px}h2{font-size:20px;line-height:1.4;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}p{margin:7px 0 13px}.muted,small{color:var(--muted)}small{display:block}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.badge{display:inline-block;font-size:12px;border-radius:5px;padding:3px 8px;background:#e5ece6;margin-right:4px;white-space:normal}.good{background:#dfede2;color:#27623c}.bad{background:#f8e5e3;color:var(--red)}.warn{background:#f6ebd5;color:var(--amber)}.candidate{background:#eee6f4;color:var(--purple)}.note{padding:13px 16px;border:1px solid #cddfd5;border-left:4px solid #5e8b79;border-radius:7px;background:#edf4ef;margin:17px 0}.identity{background:#e8ede3;padding:14px 18px;border-radius:9px;border:1px solid #d5dfd1;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:22px;margin:16px 0}.grid .card{margin:0}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px}.preview{background:#f7f9f3;border:1px solid #d3dfce;padding:14px;border-radius:8px;margin-top:15px}.stat{font-size:26px;font-weight:700}.steps{display:flex;gap:5px;flex-wrap:wrap;margin:20px 0}.steps button{flex:1;min-width:110px;font-size:13px}.steps .active{border:2px solid var(--green);background:#e5f0e6;font-weight:650}.reason{font-size:13px;color:var(--red);margin:8px 0}.row{border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.row strong{display:block}.key{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);text-align:left;padding:12px 8px;vertical-align:top}th{color:var(--muted);font-weight:500}.resultnav button.active{background:#e1eee3;border-color:var(--green)}.bartrack{height:35px;background:#f0f4ed;position:relative;margin:12px 0;border-radius:5px}.bar{position:absolute;height:25px;top:5px;background:#467d64;border-radius:4px;color:white;padding-left:8px;font-size:12px}.modalback{position:fixed;inset:0;background:#17332f77;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:white;border-radius:12px;padding:26px;max-width:660px;width:100%;max-height:90vh;overflow:auto}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}#toast{background:#ddebe1;border-radius:6px;padding:10px 15px;min-height:43px;margin-top:16px}.focusmark{background:#fff3d8;padding:5px}.blank{padding:35px;color:var(--muted);text-align:center;border:1px dashed #bfcfc4;border-radius:8px}.modeheading{display:flex;justify-content:space-between;gap:20px;align-items:center}.flow{display:flex;gap:8px;flex-wrap:wrap}.flow span{background:#eaf1e5;padding:7px 10px;border-radius:4px}a{color:var(--green)}.inline{display:flex;align-items:center;gap:7px}.inline input{width:auto;margin:0}
@media(max-width:940px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:15px}.brand{font-size:20px}.sidebtn{display:inline-block;width:auto;margin:2px;padding:6px}.sidebar footer,.side-note{display:none}.main{padding:20px}.grid{grid-template-columns:1fr}.top{display:block}}@media(max-width:520px){.twocol{grid-template-columns:1fr}.main{padding:14px}.card{padding:16px}.row{display:block}h1{font-size:25px}.steps button{min-width:85px}.modeheading{display:block}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">APS<span style="color:#c5d4a8"> / </span></div><p class="side-note">输入与排程 · 同源可追溯</p><nav id="nav" aria-label="五入口"></nav><footer>CR-INPUT-SCHED-UX<br>20261102 · Design r1<br><br>仅设计演示<br>effective=false<br>未连接产品API</footer></aside><main class="main"><div class="top"><div><div class="eyebrow">INPUT → CHECK → SCHEDULE</div><h1 id="pageTitle">输入数据</h1><p id="subtitle" class="muted"></p></div><button id="reset">重置演示</button></div><div class="note"><strong>离线交互原型 · 全部为仿真数据</strong><br>按钮只修改本页内存；文件预览、保存和运行均为演示，不解析真实Excel，不调用产品、不证明业务验收。关闭后丢弃。</div><div id="identity"></div><div id="content"></div><div id="toast" role="status" aria-live="polite">可体验：双文件独立预览 → 提交 → 工作台补缺返回 → 查看冻结结果；或查看转换预览并拒绝。</div></main></div><div id="modalroot"></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['输入数据','数据查询','数据与 CSV','工装配置','排程工作台'];
let s;function initial(){return{page:0,mode:'workbook',stage:1,v:3,nv:7,business:{selected:false,preview:null,hash:'B-DEMO-ORIGINAL'},params:{selected:false,preview:null,hash:null},adoption:'candidate',scope:'dataset',missing:true,tool:null,windowStart:3,windowEnd:5,demand:'SYN-D1',run:null,nextRun:1,resultTab:'结果',statusDemo:'真实结果',failImport:false,tab:'imports',selectionChanged:false};}s=initial();
const model=()=>s.mode==='workbook'?'工作簿 · 日粒度':'原生 · 分钟粒度';const version=()=>s.mode==='workbook'?s.v:s.nv;const dataId=()=>s.mode==='workbook'?'WB-DEMO':'NATIVE-DEMO';
function toast(t){$('toast').textContent=t;}function btn(label,a,disabled=false,cl=''){return `<button class="${cl}" data-act="${a}" ${disabled?'disabled':''}>${label}</button>`;}
function identity(){return `<div class="identity"><strong>${model()} / ${dataId()} / v${version()}</strong><small>${s.mode==='workbook'?'日0 = 2026-10-31；合格产出基准；不自动进入原生甘特':'分钟0 = 2026-11-02 08:00 +08:00；原生标准投入profile独立'} · 模拟身份</small><small>业务来源：${esc(s.mode==='workbook'?s.business.hash:'NATIVE-SOURCE-v'+s.nv)}（演示来源标识） · 参数来源：${esc(s.mode==='workbook'?(s.params.hash||'未导入'):'原生配置；未叠加workbook参数')} · ${esc(s.scope==='dataset'?'数据集共享':'仅本次试算 T-DEMO')}</small></div>`;}
function render(){
 $('nav').innerHTML=names.map((n,i)=>`<button class="sidebtn ${i===s.page?'active':''}" data-page="${i}">${n}</button>`).join('');$('pageTitle').textContent=names[s.page];$('subtitle').textContent=['两个Excel独立预览和提交，按数据集追溯来源。','先选身份，再查同版本或运行冻结输入。','原生输入的CSV和在线维护，同一规范对象。','设备能力、工装数量与物理池分别表达。','选择输入和模式，补缺后冻结本次运行。'][s.page];$('identity').innerHTML=identity();
 $('content').innerHTML=s.page===0?imports():s.page===4?workbench():s.page===1?queries():s.page===2?nativePage():toolsPage();
}
function importCard(kind){let p=s[kind],isB=kind==='business',title=isB?'业务数据 Excel':'配置参数 Excel',blocked=!p.preview||p.preview.version!==s.v||p.preview.error;return `<section class="card"><span class="badge">${isB?'必做 *：准备业务输入':'可选 ○：导入参数资料'}</span><h2>${title}</h2><p class="muted">${isB?'需求、库存、生产、补单；旧混合工作簿须明确参数采用。':'CP目录 / SP分类 / PA实例；候选不参与计算。'}</p><label>演示文件<select data-field="${kind}File"><option value="">请选择仿真样例（不读真实文件）</option><option value="sample" ${p.selected?'selected':''}>${isB?'业务数据_仿真.xlsx':'配置参数_仿真.xlsx'}</option></select></label><div class="actions">${btn('查看模板与要求',isB?'bTemplate':'pTemplate',false,'link')}</div><label>目标数据集<select aria-label="${title}目标" disabled><option>WB-DEMO / 当前 v${s.v} → 新版本</option></select></label>${isB?'<small>支持新建隔离目标；本演示固定已有目标，以展示版本冲突。</small>':`<label>保存方式<select data-field="adoption"><option value="candidate" ${s.adoption==='candidate'?'selected':''}>候选资料：不参与运行</option><option value="dataset" ${s.adoption==='dataset'?'selected':''}>当前数据集采用：支持映射项</option><option value="trial" disabled>仅本次试算批量导入：契约待实现</option></select></label><small>当前模式：workbook。trial可在线显式编辑；批量导入trial不能假称现有能力。</small>`}<div class="actions">${btn('预览'+(isB?'业务':'参数')+'（不写有效输入）','preview-'+kind,!p.selected,'primary')}</div>${!p.selected?'<div class="reason">未选择文件，不能预览。</div>':''}${p.preview?`<div class="preview"><strong>${p.preview.error?'! 预览发现错误':'✓ 预览完成'}</strong><small>preview-${kind}-v${p.preview.version} · 演示来源 ${isB?'B-DEMO-NEXT':'P-DEMO-001'}</small><p>${p.preview.error?'仿真错误：配置参数单位不合法；整批不可提交。':isB?'将为WB-DEMO生成新版本；历史运行不变；业务文件内参数不自动启用。':'CP099 / PA-DEMO / TOOL-DEMO / 可用数量=1套；[1,8)；'+(s.adoption==='candidate'?'保存候选，不解除本次缺项。':'采用受支持字段，影响此数据集后续运行。')}</p>${btn('确认'+(isB?'业务':'参数')+'提交为新版本','commit-'+kind,blocked,'primary')}${p.preview.version!==s.v?'<p class="reason">目标版本已变化，请重新预览；原预览不能提交。</p>':''}</div>`:'<p class="muted">尚未预览；未写入目标有效输入。</p>'}</section>`;}
function imports(){return `<div class="actions">${btn('双Excel导入','imports',false,s.tab==='imports'?'primary':'')}${btn('配置参数（统一页）','params',false,s.tab==='params'?'primary':'')}${btn('进入排程工作台','go-workbench')}</div>${s.tab==='params'?parameterPanel():`<div class="note">说明 i：两卡各自预览、校验、提交。此处hash栏为演示标识；产品须使用真实文件SHA256。参数模板必需三层sheet，11sheet为原件形状。</div><div class="grid">${importCard('business')}${importCard('params')}</div><section class="card"><h3>异常演示</h3><label class="inline"><input type="checkbox" data-field="failImport" ${s.failImport?'checked':''}>下一次预览模拟参数单位错误</label>${btn('模拟其他人保存新版本（制造冲突）','conflict')}<small>导入失败/409不改变有效目标；可重新预览，不能静默覆盖。</small></section>`}`;}
function parameterPanel(){return `<section class="card"><span class="badge">同源双入口</span><h2>配置参数 · 资源与工装</h2><label>作用范围<select data-field="scope"><option value="dataset" ${s.scope==='dataset'?'selected':''}>当前数据集共享配置</option><option value="trial:DEMO" ${s.scope!=='dataset'?'selected':''}>仅本次试算 T-DEMO（仿真）</option></select></label><div class="row"><div><strong>CP099 · PA-DEMO · TOOL-DEMO · 可用数量</strong><small>单位：套 · 有效期[1,8) · ${esc(s.scope)} · 随数据集v${s.v}</small><span class="badge ${s.missing?'bad':'good'}">${s.missing?'! 阻塞：缺显式可用数量':'✓ 有效值：'+s.tool+'套'}</span><small>两入口读同一个参数实体；未映射复合参数仍为候选。</small></div>${btn('编辑同源参数','edit')}</div><p>说明 i：只以开始日解析参数；运行中跨期换值尚未支持。历史run冻结值只读。</p></section>`;}
function workbench(){return `<section class="card"><div class="modeheading"><h2>输入与模式 *</h2>${btn('查看转换预览','conversion')}</div><div class="twocol"><label>输入身份<select data-field="mode"><option value="workbook" ${s.mode==='workbook'?'selected':''}>WB-DEMO · 当前 v${s.v}</option><option value="native" ${s.mode==='native'?'selected':''}>NATIVE-DEMO · 当前 v${s.nv}</option></select></label><label>运行模式<select disabled><option>${s.mode==='workbook'?'Excel 日粒度（合格产出）':'原生已有支持模式（分钟）'}</option></select></label></div><small>当前原型仅演示两种输入身份；产品保留原生minimal-r1和已有B16显式模式及各自边界。</small></section><nav class="steps" aria-label="六步">${['选择范围','就绪检查','本次约束','计算状态','结果核对','保存导出'].map((n,i)=>`<button class="${s.stage===i+1?'active':''}" data-stage="${i+1}" aria-current="${s.stage===i+1?'step':'false'}">A${i+1} ${n}</button>`).join('')}</nav>${stepContent()}`;}
function stepContent(){
 if(s.stage===1)return `<section class="card"><span class="badge">必做 *</span><h2>选择本次需求与窗口</h2><label>需求范围<input data-field="demand" value="${esc(s.demand)}"></label><div class="twocol"><label>开始${s.mode==='workbook'?'日':'分钟'}<input type="number" data-field="windowStart" value="${s.windowStart}"></label><label>结束（不含）<input type="number" data-field="windowEnd" value="${s.windowEnd}"></label></div><p>说明 i：需求SYN-D1为180kg仿真样例；使用当前输入版本。边界与单位按所选模式解释。</p>${btn('检查本次范围','check',false,'primary')}</section>`;
 if(s.stage===2)return `<section class="card"><h2>A2 就绪检查</h2><p><span class="badge ${s.missing?'bad':'good'}">${s.missing?'! 1项阻塞':'✓ 演示所选范围已补齐'}</span><span class="badge warn">△ 1项警告</span><span class="badge candidate">◇ 候选资料单列</span></p><div class="row"><div><strong>${s.mode==='workbook'?'CP099 / PA-DEMO':'tools / G-DEMO'} · 可用数量${s.missing?'待补充':s.tool+'套'}</strong><small>对象TOOL-DEMO；来源${s.mode==='workbook'?'参数样例 / 仿真参数实例 / 第3行':'原生工装CSV / 第2行'}；影响所选需求工装规则</small></div>${btn('去填写并返回本步骤','edit')}</div><div class="row"><div><strong>△ 待检批次无放行日</strong><small>此批次不可用；其他合格供给可用时不阻塞全局。</small></div><span class="badge warn">警告</span></div><div class="row"><div><strong>⛔ 跨模型分钟工时缺真实依据</strong><small>责任：输入资料维护人员；仅阻断转换。当前版本没有该映射编辑器，不提供假定位。</small></div><span class="badge">当前运行不适用 —</span></div><p>说明 i：本页演示结果与产品检查无关；产品必须按所选版本和规则返回真实缺口。</p><div class="actions">${btn('重新检查','recheck')}${btn('继续配置本次约束','step3',s.missing,'primary')}</div>${s.missing?'<p class="reason">请先填写明确工装数量；未知不能当0或无限资源。</p>':''}</section>`;
 if(s.stage===3)return `<section class="card"><h2>A3 本次约束</h2>${s.mode==='workbook'?parameterPanel():'<p>原生规则：机器、顺序、日历、工装；物料是否采用由已有规则设置决定。workbook CP/PA不隐式叠加。</p>'}<div class="preview"><strong>本次输入摘要</strong><p>${model()} / ${dataId()} v${version()} · ${esc(s.demand)} · [${s.windowStart},${s.windowEnd}) · ${esc(s.scope)}</p><small>开始日/时刻采用；旧运行保持冻结。当前只演示已有支持范围。</small></div>${btn('核对摘要并去计算状态','step4',false,'primary')}</section>`;
 if(s.stage===4)return `<section class="card"><h2>A4 计算状态</h2><p>必做 *：确认输入、参数和检查身份一致，服务端创建前仍须重查。</p>${btn('演示创建运行（冻结当前内存）','run',s.missing,'primary')}${s.missing?'<p class="reason">工装可用数量缺失，请返回A2填写；不会创建假成功运行。</p>':''}${s.run?`<div class="preview"><strong>✓ 演示结果已创建</strong><p>${esc(s.run.id)} / ${esc(s.run.model)} / v${s.run.version} · ${esc(s.run.status)}</p><small>仿真结果已直接生成，没有真实Worker或进度；产品进度必须来自后端。</small>${btn('核对该冻结结果','step5')}</div>`:''}<hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><label>状态文案预览（仅展示，不改运行）<select data-field="statusDemo">${['真实结果','queued','running','partial','timed_out','failed','cancel_requested','cancelled','未检查','空范围'].map(x=>`<option ${s.statusDemo===x?'selected':''}>${x}</option>`).join('')}</select></label><p>${statusLabel(s.statusDemo)}</p></section>`;
 if(s.stage===5)return resultPanel();
 return `<section class="card"><h2>A6 保存与导出</h2>${s.run?`<span class="badge good">✓ 仿真run在本页内存已保存</span><p>运行${esc(s.run.id)} / ${s.run.model} / v${s.run.version}。关闭本页即丢弃，不是服务端持久化。</p><small>配置参数导出 / 当前业务数据导出 / 冻结运行导出必须分开；此按钮只导出原型冻结JSON。</small>${btn('下载本原型冻结结果JSON','export',false,'primary')}`:'<div class="blank">尚无运行，不能保存或导出假结果。请到A4。</div>'}</section>`;
}
function statusLabel(x){return({'真实结果':'运行结果状态和检查范围分别显示；不估计百分比。',queued:'等待计算资源。',running:'正在计算；只显示服务端实际阶段。',partial:'已有结果，仍有未排需求/任务，需查看原因。',timed_out:'达到计算时限，未找到可用结果；不代表没有可行排法。workbook若实际为failed，保留failed和超时原因。',failed:'计算未完成，冻结输入保留。',cancel_requested:'正在停止，等待服务端确认；不能提前写已取消。',cancelled:'已取消，未保存部分结果；原输入和方案保留。','未检查':'本条件尚未检查，不能作为通过。','空范围':'所选窗口没有需求，未创建成功运行。'})[x]||'';}
function resultPanel(){if(!s.run)return '<section class="card blank">尚无运行。请先在A2补缺，然后到A4。</section>';const r=s.run;return `<section class="card"><h2>A5 结果核对</h2><div class="identity"><strong>${esc(r.id)} / ${esc(r.model)} / v${r.version}</strong><small>冻结输入${esc(r.hash)}（演示标识） · ${esc(r.demand)} / [${r.start},${r.end}) / 工装${r.tool}套</small>${r.version!==(r.model==='workbook'?s.v:s.nv)?'<span class="badge warn">当前输入已有新版本；本运行仍显示原值</span>':''}</div><div class="actions resultnav">${['结果','甘特','问题','来源'].map(t=>btn(t,'result-'+t,false,s.resultTab===t?'active':'')).join('')}</div>${r.resultTab==='unused'?'':resultBody(r)}<div class="actions">${btn('模拟新输入增版（观察冻结）','updateCurrent')}${btn('去保存导出','step6',false,'primary')}</div></section>`;}
function resultBody(r){if(s.resultTab==='结果')return `<div class="row"><div><span class="stat">${r.tool===0?0:1} / 1</span><small>仿真需求已安排 / 需求数</small></div><div><span class="stat">180 kg</span><small>仿真合格需求，非加工损耗推导</small></div></div><p>检查范围：本原型不执行任何实际规则检查。产品应列实际已检查/未检查项。</p>${btn('定位任务 SYN-T1','task',false,'link')}`;if(s.resultTab==='甘特'&&r.tool===0)return '<p>仿真数量0，无已排任务，不生成虚构甘特条。</p>';if(s.resultTab==='甘特')return `<p>任务SYN-T1 · ${r.model==='workbook'?'日轴 [3,4)，不表示分钟内可用性':'分钟轴 [0,60)，仿真时长，非业务默认'}</p><div class="bartrack"><div class="bar" style="left:12%;width:52%">SYN-T1 · TOOL-DEMO</div></div>${btn('定位同任务来源','source',false,'link')}<small>纯线框演示；产品只能用实际冻结任务生成甘特，不生成虚构时间条。</small>`;if(s.resultTab==='问题')return `<div class="row"><div><strong>SYN-T1 · 仿真提示</strong><small>没有真实产品问题；此项演示同任务双向定位。</small></div>${btn('定位同任务','task')}</div>`;return `<h3>同一冻结来源 · SYN-T1</h3><div class="tablewrap"><table><tr><th>字段</th><th>冻结值</th></tr><tr><td>输入/参数/映射</td><td>${esc(r.model)} v${r.version} / ${esc(r.scope)} / 演示映射</td></tr><tr><td>业务来源</td><td>${esc(r.businessHash)}</td></tr><tr><td>参数来源</td><td>${esc(r.parameterHash||'在线仿真补齐')}</td></tr><tr><td>工装数量</td><td>${r.tool}套；只读；当前修改不写回本值</td></tr></table></div>${btn('回到同任务结果','task',false,'link')}`;}
function queries(){return `<section class="card"><h2>先选查询身份 *</h2><label>查询对象<select data-field="queryIdentity"><option value="current">${model()} / 当前v${version()}</option>${s.run?`<option value="frozen">${s.run.id} / 冻结v${s.run.version}</option>`:''}</select></label><p>当前列表：${dataId()} / v${version()}；只读。工作簿数据与原生当前输入分别查询。</p><div class="row"><div><strong>TOOL-DEMO · 当前数量 ${s.missing?'待补充':s.tool+'套'}</strong><small>该页不复制参数主账；导航同一个权威编辑器。</small></div>${btn('去权威维护处','maintain')}</div>${s.run?btn('查看运行冻结来源','frozen-query'):''}</section>`;}
function nativePage(){return `<section class="card"><span class="badge">原生输入 · NATIVE-DEMO</span><h2>数据与 CSV</h2><p>原生/API输入维护保持原路径。逐类CSV模板、预览、校验、原子提交与在线编辑写同规范对象；本原型未模拟所有CSV操作。</p><div class="flow"><span>选择类别</span>→<span>预览校验</span>→<span>确认提交新版本</span></div><p>workbook导入不会自动出现在此处。跨模型必须先看转换差异。</p>${btn('查看跨模型转换契约','conversion')}${btn('用原生模式进入工作台','native-workbench')}</section>`;}
function toolsPage(){return `<section class="card"><h2>工装专题 · 当前${model()}</h2><div class="row"><div><strong>设备能力与工装物理池分别维护</strong><small>TOOL-DEMO / G-DEMO · 当前${s.missing?'数量未知':s.tool+'套'}。同一共享工装不能因两台设备重复复制。</small></div>${btn('打开当前模型权威编辑器','edit')}</div><p>workbook指向设备与工装/同源PA；native指向已有工装规范表。查询/步骤复用同记录，不能另存专题版。</p>${btn('查看来源和转换差异','conversion')}</section>`;}
let editing=null,restoreFocus=null;
const values={'workbook|dataset':null,'native|dataset':null};
function saveScope(){values[s.mode+'|'+s.scope]=s.missing?null:s.tool;}function loadScope(){s.tool=values[s.mode+'|'+s.scope]??null;s.missing=s.tool===null;}
function closeModal(){editing=null;$('modalroot').innerHTML='';if(restoreFocus&&restoreFocus.isConnected)restoreFocus.focus();}
function modal(html){restoreFocus=document.activeElement;$('modalroot').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="设计交互"><div>${html}</div></section></div>`;setTimeout(()=>{const e=$('modalroot').querySelector('input,button,select');if(e)e.focus();},0);}
function edit(){editing={expected:version(),page:s.page,stage:s.stage,mode:s.mode,scope:s.scope};modal(`<span class="badge">${s.mode==='workbook'?'CP099 / PA-DEMO':'原生tools / G-DEMO'} · 同源维护</span><h2>TOOL-DEMO · 可用数量</h2><p>返回位置：${names[s.page]}${s.page===4?' / A'+s.stage:''}；需求${esc(s.demand)}，窗口[${s.windowStart},${s.windowEnd})保留。</p><div class="preview">期望v${editing.expected} · ${esc(s.scope)}<br>${s.mode==='workbook'?'[1,8) · 参数样例 / 仿真参数实例 / 第3行':'原生工装CSV / 第2行'}<br>缺失不补0；显式0表示已知无可用资源。</div><label>可用数量（套） *<input id="toolValue" type="number" min="0" step="1" value="${s.tool===null?'':s.tool}" aria-describedby="editReason"></label><p id="editReason" class="reason"></p><div class="actions">${btn('保存并返回原步骤','save-edit',false,'primary')}${btn('取消并返回','close')}${btn('模拟并发增版','edit-conflict')}</div><div id="compare"></div>`);}
function conversion(){modal(`<span class="badge candidate">拟议契约 · 产品未实现</span><h2>转换预览 · ${dataId()} v${version()}</h2><p>目标：另一模型的新隔离副本；源模式继续可用。拒绝不会更改目标有效数据。</p><div class="tablewrap"><table><tr><th>字段/语义</th><th>判定</th></tr><tr><td>物料编码/单位</td><td>仅同类型同单位可无损映射，须保留来源键</td></tr><tr><td>日容量→分钟工时</td><td>! 缺实际班次时段和分钟工时，阻断确认；责任：资料维护人员</td></tr><tr><td>合格产出→标准投入</td><td>! 缺基准/损耗含义，不能重复扣损耗；责任：业务owner与Design</td></tr><tr><td>工装/B16</td><td>! 真实物理池与多线归属未明确，不把仿真单线升格</td></tr><tr><td>重复需求</td><td>须按source lineage去重，无业务关联键不能猜合并</td></tr></table></div><p class="reason" id="convertReason">存在待决语义，本次只可预览/拒绝；尚未生成任何目标版本。</p><div class="actions">${btn('确认生成新目标（不可用）','never',true,'primary')}${btn('拒绝转换，保留原模式','reject')}${btn('返回','close')}</div>`);}
function action(a){
 if(a==='close'){closeModal();return;}
 if(a==='edit'){edit();return;}
 if(a==='conversion'){conversion();return;}
 if(a==='reject'){closeModal();toast('已拒绝转换；源和目标有效版本均未改变。转换预览不是已联动。');return;}
 if(a==='bTemplate'||a==='pTemplate'){modal(`<h2>${a==='bTemplate'?'业务Excel':'参数Excel'}模板要求</h2><p>${a==='bTemplate'?'既有OOXML xlsx、12MB以内；按profile支持的需求/库存/生产/补单表，字段来源及日期/数量口径须明确。':'必需参数清单、仿真参数分类、仿真参数实例；CP定义/SP分类/PA记录分别校验；候选不能自动采用。'}</p><p>原型只说明字段要求，不提供伪模板下载。真实模板由产品已有API/指定资产取得。</p>${btn('返回','close')}`);return;}
 if(a==='edit-conflict'){s.mode==='workbook'?s.v++:s.nv++;render();$('editReason').textContent='模拟并发：当前版本已变化，草稿保留。保存时将返回409。';return;}
 if(a==='save-edit'){
  const raw=$('toolValue').value;if(raw.trim()===''||!Number.isInteger(Number(raw))||Number(raw)<0){$('editReason').textContent='请填写明确非负整数；空白不等于0。';return;}
  if(editing.expected!==version()){$('editReason').textContent='409 版本冲突：原期望v'+editing.expected+'，当前v'+version()+'；草稿仍保留。';$('compare').innerHTML=`<p>当前值：${s.tool??'未知'}；草稿值：${esc(raw)}</p>${btn('已比较，采用当前版本重试','rebase')}`;return;}
  s.tool=Number(raw);s.missing=false;saveScope();s.mode==='workbook'?s.v++:s.nv++;const ret='已保存v'+version()+'；已返回原位置，需求/窗口/scope保留；已在原型内重查。'+(s.tool===0?'已知数量0可能导致运行未排。':'');closeModal();render();const focusTarget=$('content').querySelector('[data-act="edit"]')||$('content').querySelector('[aria-current="step"]');if(focusTarget)focusTarget.focus();toast(ret);return;
 }
 if(a==='rebase'){editing.expected=version();$('editReason').textContent='已显式采用当前期望版本；请再点击保存。';$('compare').innerHTML='';return;}
 if(a==='conflict'){s.v++;render();toast('模拟其他编辑生成v'+s.v+'；已有预览过期，没有提交导入。');return;}
 if(a.startsWith('preview-')){const k=a.slice(8);s[k].preview={version:s.v,error:k==='params'&&s.failImport};render();toast('已独立预览'+(k==='business'?'业务':'参数')+'样例；目标有效版本未变。');return;}
 if(a.startsWith('commit-')){const k=a.slice(7),p=s[k].preview;if(!p||p.error||p.version!==s.v){toast('预览不可提交，请更正错误或重新预览。');return;}s.v++;s[k].preview=null;if(k==='business')s.business.hash='B-DEMO-NEXT';else{s.params.hash='P-DEMO-001';if(s.adoption==='dataset'){values['workbook|dataset']=1;loadScope();}}render();toast('仿真提交为v'+s.v+'；'+(k==='params'&&s.adoption==='candidate'?'参数仅候选，不解除运行缺项。':'新运行可选择新版本，历史运行不变。'));return;}
 if(a==='imports'||a==='params'){s.tab=a;render();return;}
 if(a==='go-workbench'){s.page=4;s.mode='workbook';loadScope();render();return;}
 if(a==='native-workbench'){saveScope();s.page=4;s.mode='native';s.scope='dataset';s.windowStart=0;s.windowEnd=600;loadScope();render();return;}
 if(a==='check'){if(!s.demand.trim()||!Number.isFinite(s.windowStart)||!Number.isFinite(s.windowEnd)||s.windowEnd<=s.windowStart){toast('范围无效：需求非空、结束大于开始。');return;}s.stage=2;render();toast('已按本页仿真范围检查；不会调用产品API。');return;}
 if(a==='recheck'){render();toast('原型重查：'+(s.missing?'可用数量仍缺失。':'显式数量已保存；零数量保持已知0。'));return;}
 if(/^step[3-6]$/.test(a)){s.stage=Number(a.slice(4));render();return;}
 if(a==='run'){if(s.missing)return;s.run={id:'SYN-RUN-'+s.nextRun++,model:s.mode,version:version(),hash:'SNAP-DEMO-v'+version(),scope:s.scope,demand:s.demand,start:s.windowStart,end:s.windowEnd,tool:s.tool,businessHash:s.mode==='workbook'?s.business.hash:'NATIVE-SOURCE-v'+s.nv,parameterHash:s.mode==='workbook'?s.params.hash:'NATIVE-CONFIG',status:s.tool===0?'partial（仿真无可用工装）':'completed（仿真）'};render();toast('已创建仿真冻结对象；没有真实计算或规则验证。');return;}
 if(a.startsWith('result-')){s.resultTab=a.slice(7);render();return;}
 if(a==='source'||a==='task'){s.resultTab=a==='source'?'来源':'结果';render();toast('已定位同runRef任务SYN-T1；没有切到当前输入。');return;}
 if(a==='updateCurrent'){s.mode==='workbook'?s.v++:s.nv++;render();toast('当前输入已增版；run冻结版本和数量保持。');return;}
 if(a==='export'){const data=JSON.stringify({kind:'SYNTHETIC_DESIGN_PROTOTYPE',verification:'NOT_EXECUTED',run:s.run},null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),e=document.createElement('a');e.href=url;e.download='APS-设计原型-冻结样例.json';e.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('下载的是原型仿真JSON，不是产品结果。');return;}
 if(a==='frozen-query'){s.page=4;s.stage=5;s.resultTab='来源';render();return;}
 if(a==='maintain'){if(s.mode==='workbook'){s.page=0;s.tab='params';render();}else edit();return;}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='reset'){s=initial();for(const k of Object.keys(values))delete values[k];values['workbook|dataset']=values['native|dataset']=null;closeModal();render();toast('已重置内存演示。');}else if(b.dataset.page!==undefined){s.page=Number(b.dataset.page);render();}else if(b.dataset.stage){s.stage=Number(b.dataset.stage);render();}else if(b.dataset.act)action(b.dataset.act);});
document.addEventListener('change',e=>{const k=e.target.dataset.field;if(!k)return;const v=e.target.value;if(k.endsWith('File')){const q=k==='businessFile'?'business':'params';s[q].selected=!!v;s[q].preview=null;}else if(k==='adoption'){s.adoption=v;s.params.preview=null;}else if(k==='mode'){saveScope();s.mode=v;s.scope='dataset';s.windowStart=v==='workbook'?3:0;s.windowEnd=v==='workbook'?5:600;s.stage=1;loadScope();}else if(k==='scope'){saveScope();s.scope=v;loadScope();}else if(k==='failImport')s.failImport=e.target.checked;else if(k==='queryIdentity'){if(v==='frozen'){action('frozen-query');return;}}else if(['windowStart','windowEnd'].includes(k))s[k]=Number(v);else s[k]=v;render();});
document.addEventListener('keydown',e=>{if(!$('modalroot').firstElementChild)return;if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const els=[...$('modalroot').querySelectorAll('button:not(:disabled),input,select,a[href]')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script></body></html>

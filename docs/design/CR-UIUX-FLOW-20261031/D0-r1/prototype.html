<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APS · 流程化排程 D0 交互原型</title><style>

</style></head><body><header><div><strong>APS</strong> <span>在线排程工作台</span><br><small>从订单到可核对的方案</small></div><small>共享访问 · 共用数据与操作权限<br>D0 r1 · 2026-10-31</small></header><div class="ribbon">设计评审原型 · 全部运行/数据为离线模拟，无产品连接，不产生真实排程或审批；product_sha=null。</div><div class="shell"><aside aria-label="工作区导航"><button data-action="work">◈ 排程工作台</button><button data-action="data">▤ 数据与 CSV</button><button data-action="history">▣ 冻结方案</button><button data-action="roadmap">◇ 下一阶段</button></aside><main><div class="eyebrow">PLAN / CHECK / UNDERSTAND</div><h1 id="title">本次排程</h1><p class="sub">选择、补缺、配置、核对。每一步都知道下一步去哪里。</p><div id="context" class="context"></div><nav id="steps" class="steps" aria-label="六步排程"></nav><div id="live" class="live" role="status" aria-live="polite"></div><div id="view"></div></main></div><dialog id="editor" aria-labelledby="editorTitle"></dialog><script>'use strict';
// Offline interaction fixture. No product endpoints, worker or scheduling algorithm.
const $=s=>document.querySelector(s),clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stepNames=['选择范围','数据就绪','本次约束','计算状态','甘特核对','保存导出'];
const initial={ids:['A','B'],start:'0',end:'600',reason:'',mode:'supported',sort:'规则设置',calendar:'',demand:'',version:1,configVersion:0,appliedVersion:0};
let input=clone(initial),step=0,page='work',checked=false,run=null,history=[],selected='B-MIX',filter='全部',kind='current',scenario='completed',editorType='',returnFocus=null,returnScroll=0,dirty=false;
let storageOK=true;
try{history=JSON.parse(localStorage.getItem('aps-uiux-d0-r1')||'[]')}catch{storageOK=false}
const say=s=>{$('#live').textContent=s};
const blocks=()=>[...(!input.ids.length?['至少选择一张有效正式订单']:[]),...(!input.reason.trim()?['填写操作原因']:[]),...(!Number.isFinite(Number(input.start))||!Number.isFinite(Number(input.end))||!input.start.trim()||!input.end.trim()||Number(input.start)<0||Number(input.end)<=Number(input.start)?['范围必须满足 0 ≤ 开始 < 结束']:[]),...(!input.calendar?['MIX02 缺少日历引用']:[]),...(input.ids.includes('B')&&!input.demand?['订单 B 缺少需求类型']:[]),...(input.configVersion!==input.appliedVersion?['B 补录配置尚未显式应用']:[])];
const isBusy=()=>run&&['submitting','queued','running','cancel_requested'].includes(run.status);
function mutate(){input.version++;checked=false;if(run&&kind!=='history')say('当前输入已改，旧结果保持冻结；请重新检查并另开演示运行。')}
const currentRun=()=>run;
const fixture=ids=>[{id:'A-MIX',order:'A',op:'混合',machine:'MIX01',start:0,end:30},{id:'A-FILL',order:'A',op:'灌装',machine:'FILL01',start:30,end:60},{id:'B-MIX',order:'B',op:'混合',machine:'MIX02',start:15,end:45},{id:'B-FILL',order:'B',op:'灌装',machine:'FILL02',start:45,end:75}].filter(t=>ids.includes(t.order));
function resultFor(snapshot,outcome){let tasks=fixture(snapshot.ids),unplanned=[];
 if(outcome==='partial'){unplanned=tasks.filter(t=>t.order==='B').map(t=>({...t,start:null,end:null,reason:'演示夹具：连续可用窗口不足30分钟；前序未排阻断后序'}));tasks=tasks.filter(t=>t.order!=='B')}
 if(outcome==='zero'){unplanned=tasks.map(t=>({...t,start:null,end:null,reason:'演示夹具：无完整连续可用窗口'}));tasks=[]}
 return {tasks,unplanned,checked:snapshot.mode==='minimal-r1'?['MACHINE','PRECEDENCE']:['MACHINE','PRECEDENCE','CALENDAR'],unchecked:snapshot.mode==='minimal-r1'?['CALENDAR','MOLD','LABOR','MATERIAL']:['MOLD','LABOR','MATERIAL'],independent:'未检查'};
}
function draw(){
 $('#context').innerHTML=`<span class="pill">${kind==='history'?'历史冻结方案 · 只读':kind==='trial'?'试算副本 · 离线草稿':'当前输入 · 共享草稿'}</span><span class="pill">L01 · 输入 v${input.version}</span><span class="pill">0 = 11月2日 08:00 +08:00</span><span class="pill">第 ${step+1} / 6 步</span>`;
 $('#steps').innerHTML=stepNames.map((n,i)=>`<button data-step="${i}" ${i===step?'aria-current="step"':''}>${i+1} ${n}${i===1&&blocks().length?' · 需补缺':''}${i===1&&checked?' ✓':''}</button>`).join('');
 if(page==='data'){renderData();return}if(page==='history'){renderHistory();return}if(page==='roadmap'){renderRoadmap();return}
 $('#title').textContent=stepNames[step];
 const views=[renderSelect,renderCheck,renderConfig,renderRun,renderResult,renderSave];views[step]();
}
function footer(next,label){return `<div class="footer"><button data-action="back" ${step===0?'disabled':''}>← 上一步</button><button class="primary" data-action="${next}">${label}</button></div>`}
function renderSelect(){
 $('#view').innerHTML=`<div class="card"><h2>先选这次要排的订单</h2><p class="muted">此处是明确的模拟样例，不提供现场默认值。正式订单且有效才能选入。</p><div class="scroll"><table><thead><tr><th>选择</th><th>订单 / 产品</th><th>需求</th><th>状态与来源</th><th>维护</th></tr></thead><tbody>${['A','B'].map(o=>`<tr><td><input type="checkbox" aria-label="选择订单 ${o}" data-order="${o}" ${input.ids.includes(o)?'checked':''}></td><td>${o} · HC40 / L01</td><td>240 kg</td><td>有效 / 模拟 ${o==='B'&&!input.demand?'· 需求类型待补':'· 正式订单'}</td><td><button data-edit="order">订单字段</button></td></tr>`).join('')}<tr><td>不可选</td><td>C · 预测单</td><td>仅作查询</td><td>预测未进入正式待排</td><td>下一阶段</td></tr></tbody></table></div><div class="grid"><label>开始分钟<input id="start" type="number" min="0" value="${esc(input.start)}"></label><label>结束分钟<input id="end" type="number" min="1" value="${esc(input.end)}"></label></div><p class="small">半开区间 [开始,结束)。开始分钟不移动原日历、人员或到料窗口。演示结果夹具仅支持 0–600。</p><label>操作原因（必填）<input id="reason" value="${esc(input.reason)}" placeholder="例如：本次样例试算" required></label></div>${footer('check','检查本次数据 →')}`;
}
function renderCheck(){let b=blocks();$('#view').innerHTML=`<div class="grid three"><div class="card"><span class="metric">${b.length}</span><br>待补项</div><div class="card"><span class="metric">${input.ids.length}</span><br>所选订单</div><div class="card"><span class="tag">${checked?'本版本已检查':'尚未检查 / 需重检'}</span><br>修改后请检查</div></div><div class="card"><h2>在这里补缺，然后回到本次排程</h2>${b.length?`<div class="note warn">${b.map(esc).join('；')}。</div>`:'<div class="note">基础数据就绪；工装/人员/物料仍未检查。</div>'}<article><h3>${input.calendar?'✓':'!'} 设备 MIX02 · 日历编号</h3><p>主数据 · machines / MIX02 / 日历编号<br>模拟来源 v${input.version}；需指向 L01 所属工厂的日历。</p><button data-edit="machine">定位并维护日历引用</button></article><hr><article><h3>${input.demand?'✓':'!'} 订单 B · 需求类型</h3><p>交易数据 · orders / B / 需求类型<br>补录配置保存后，还需显式应用当前输入；不设全局默认。</p><button data-edit="order">定位并维护订单补录</button> <button data-action="apply" ${input.configVersion===input.appliedVersion?'disabled':''}>显式应用补录到当前输入</button><p class="small">保存配置 v${input.configVersion} / 当前已采用 v${input.appliedVersion}</p></article><div class="actions"><button data-action="recheck">重新检查受影响项</button></div></div>${footer('config','查看本次约束 →')}`}
function renderConfig(){const b=blocks();$('#view').innerHTML=`<div class="card"><h2>配置放在本次计算之前</h2><label>计算模式<select id="mode"><option value="supported" ${input.mode==='supported'?'selected':''}>已有支持模式</option><option value="minimal-r1" ${input.mode==='minimal-r1'?'selected':''}>R1 最小模式 · 仅机器与顺序</option></select></label><div class="note">${input.mode==='supported'?'本次基础检查：机器、工序顺序、日历。':'本次仅机器与工序顺序；日历明确未检查。'}<br>这是尚未冻结的预览；产品应以服务端实际采用范围为准。</div><fieldset><legend>基础约束</legend><label><input type="checkbox" checked disabled> MACHINE 机器不重叠 · 受保护</label><label><input type="checkbox" checked disabled> PRECEDENCE 工序顺序 · 受保护</label><label><input type="checkbox" ${input.mode==='supported'?'checked':''} disabled> CALENDAR 完整连续日历 · 当前模式决定</label></fieldset><label>任务排序<select id="sort">${['规则设置','优先顺序','要求日期'].map(x=>`<option ${input.sort===x?'selected':''}>${x}</option>`).join('')}</select></label><button data-edit="machine">维护设备 / 日历</button><details><summary>高级约束 · 按需展开</summary><p>工装：UAT03 指定占用及来源；人员：UAT04 指定池、技能、班次；物料：UAT05 normalized限定范围。待同候选复现并经PM核定后开放。</p><button disabled>MOLD / LABOR / MATERIAL 尚未开放</button><p>DEC04–06新增应用、跨方案全局预占B02仍待批准。已有人员/执行事实保护不能由开关解除。</p></details></div><div class="note ${b.length?'warn':''}">${b.length?'无法提交：'+b.map(esc).join('；'):checked?'已检查本版输入，可查看提交反馈。':'需要重新检查当前版本。'}</div>${footer('runpage','去计算与状态 →')}`}
const statusNames={submitting:'正在提交（模拟）',queued:'等待线程（模拟）',running:'计算中（模拟）',completed:'运行结束 · 仅本次检查范围（模拟）',partial:'部分完成 · 存在未排（模拟）',zero:'运行结束 · 无已排任务（模拟）',failed:'计算失败（模拟）',timed_out:'超时，不代表无解（模拟）',cancel_requested:'正在停止，等待确认（模拟）',cancelled:'已取消（模拟）',unknown:'网络中断 · 状态未知（模拟）'};
function renderRun(){const b=blocks(),badFixture=input.start!=='0'||input.end!=='600',blocked=b.length||!checked||isBusy()||kind==='history'||badFixture;let why=kind==='history'?'正在查看历史；请去当前输入或新建试算':b.length?b.join('；'):!checked?'请重新检查当前版本':badFixture?'当前范围超出离线0–600夹具；此原型不计算新安排':isBusy()?'本次已有提交/运行，等待状态更新':'当前模拟夹具可用';
 $('#view').innerHTML=`<div class="card"><h2>提交后，应在这里看见真实反馈</h2><p>产品设计：立即显示提交中；收到运行号才表示已受理；状态与 phase 来自现有运行记录。当前原型手动演示状态，不连接产品，不用时间模拟进度。</p><p class="note ${blocked?'warn':''}">${esc(why)}</p><button class="primary" data-action="submit" ${blocked?'disabled':''}>演示另开计算（冻结当前输入）</button><details><summary>设计状态试验台 · 选择模拟结果</summary><label>下一次演示终态<select id="scenario">${['completed','partial','zero','failed','timed_out'].map(s=>`<option value="${s}" ${scenario===s?'selected':''}>${statusNames[s]}</option>`).join('')}</select></label><p>测试用状态选取不属于产品操作界面。</p></details></div>${run?`<div class="card"><span class="eyebrow">${esc(run.id)} · 输入 v${run.snapshot.version}</span><h2>${statusNames[run.status]||esc(run.status)}</h2><p>实际阶段：${esc(run.phase)}；无百分比估算。</p><p>冻结订单：${run.snapshot.ids.join('、')} · 模式 ${esc(run.snapshot.mode)} · 范围 ${run.snapshot.start}–${run.snapshot.end}</p>${run.result?`<div class="grid three"><div><span class="metric">${run.result.tasks.length}</span> 已排任务</div><div><span class="metric">${run.result.unplanned.length}</span> 未排任务</div><div>独立复核<br><b>${run.result.independent}</b></div></div><div class="actions"><button class="primary" data-action="result">查看甘特与任务 →</button></div>`:`<div class="note ${['failed','timed_out','unknown'].includes(run.status)?'warn':''}">${run.status==='failed'?'模拟内部错误：本次无结果。保留原输入与旧方案。':run.status==='timed_out'?'模拟超时：没有本次结果，不等于无可行解。':run.status==='unknown'?'模拟连接丢失：按同一运行号恢复状态；不要重复提交。':run.status==='cancelled'?'模拟取消已确认，没有保存部分结果。':'模拟反馈待推进，点击下方接收状态事件。'}</div>`}<div class="actions">${['submitting','queued','running','cancel_requested'].includes(run.status)?'<button data-action="advance">演示接收下一条状态事件</button>':''}${['queued','running'].includes(run.status)?'<button data-action="cancel">演示请求取消</button><button data-action="disconnect">演示连接中断</button>':''}${run.status==='unknown'?'<button data-action="recover">演示按原运行号恢复查询</button>':''}<button data-action="runexport">导出演示运行记录</button></div><details><summary>本次冻结输入与来源</summary><pre>${esc(JSON.stringify(run.snapshot,null,2))}</pre></details></div>`:''}${footer('result','核对结果 →')}`}
function renderResult(){const r=currentRun();if(!r?.result){$('#view').innerHTML='<div class="card"><h2>本次还没有可用结果</h2><p>失败、取消或尚未完成都不能显示旧图为本次结果。</p><button data-action="runpage">返回运行状态</button></div>';return}
 let all=[...r.result.tasks,...r.result.unplanned],tasks=all.filter(t=>filter==='全部'||t.order===filter),t=all.find(x=>x.id===selected);if(!t)t=all[0];
 $('#view').innerHTML=`<div class="note">${esc(r.id)} · ${kind==='history'?'历史冻结':'冻结运行结果'} v${r.snapshot.version} · 计算检查：${r.result.checked.join(' / ')}<br>未检查：${r.result.unchecked.join(' / ')}；独立复核：${r.result.independent}。${r.snapshot.version!==input.version?'当前输入已变化，旧图不随之改写。':''}</div><div class="card"><div class="grid"><h2>${r.result.tasks.length} 已排 / ${r.result.unplanned.length} 未排</h2><label>筛选订单<select id="filter">${['全部','A','B'].map(o=>`<option ${filter===o?'selected':''}>${o}</option>`).join('')}</select></label></div><div class="actions"><button data-action="clearfilter">清除筛选与窗口</button><button disabled>拖拽 / 锁定 · 下一阶段 #40</button></div>${!tasks.length?`<div class="note warn">${all.length?'有任务，当前筛选无匹配；请清除筛选。':'本次无需求任务，请返回范围核对。'}</div>`:''}${r.result.tasks.length?`<div class="scroll" aria-label="机器甘特图，可横向滚动"><div class="timeline"><div class="axis"><span>08:00 / 0</span><span>08:30 / 30</span><span>09:00 / 60</span><span>09:30 / 90</span></div>${['MIX01','MIX02','FILL01','FILL02'].map(m=>`<div class="lane"><b>${m}</b><div>${tasks.filter(t=>t.machine===m&&t.start!==null).map(t=>`<button class="bar ${selected===t.id?'selected':''}" data-task="${t.id}" style="margin-left:${t.start/90*50}%;width:40%">${t.id} · ${t.start}–${t.end} min</button>`).join('')}</div></div>`).join('')}</div></div>`:'<div class="note warn">本次没有已排任务。未排任务没有虚构时间条，请查看原因。</div>'}<div class="scroll"><table><caption>任务时间表 · 与甘特相同冻结对象</caption><thead><tr><th>任务</th><th>设备</th><th>时间 / 状态</th><th>定位</th></tr></thead><tbody>${tasks.map(t=>`<tr class="${selected===t.id?'selected':''}"><td>${t.id}</td><td>${t.machine}</td><td>${t.start===null?'未排：'+t.reason:`[${t.start},${t.end}) min`}</td><td><button data-task="${t.id}">定位任务</button></td></tr>`).join('')}</tbody></table></div></div><div class="grid"><div class="card"><h2>任务 / 资源 / 来源</h2>${t?`<b>${esc(t.id)}</b><p>资源：${t.machine}<br>${t.start===null?'未排，无已排占用区间':`计划设备占用 [${t.start},${t.end}) min`}<br>模拟输入 v${r.snapshot.version}；${r.snapshot.mode==='minimal-r1'?'日历未检查':'日历 FC01'}。</p><div class="actions"><button data-source="task">查看冻结来源</button><button data-source="resource">资源 → 相关任务</button><button data-source="material">物料来源范围</button></div>`:'无任务可定位'}</div><div class="card"><h2>问题与未检查</h2>${r.result.unplanned.length?r.result.unplanned.map(t=>`<p>CALENDAR · ${t.id}：${t.reason}</p><button data-task="${t.id}">问题 → ${t.id}</button>`).join(''):'<p>此演示夹具没有未排任务；不能据此断言完整业务可执行。</p>'}<p>工装、人员、物料未检查。物料来源原生映射在 #38 后续，不捏造物理行。</p><button disabled>独立复核 · 产品接入待候选</button></div></div>${footer('savepage','保存并导出 →')}`}
function renderSave(){if(!run?.result){$('#view').innerHTML='<div class="card">尚无可保存结果。<button data-action="runpage">查看运行</button></div>';return}$('#view').innerHTML=`<div class="card"><h2>保留这次方案的完整上下文</h2><p>冻结运行 ${esc(run.id)} · 输入 v${run.snapshot.version} · ${run.result.tasks.length} 已排 / ${run.result.unplanned.length} 未排。当前输入变更不会改变本次保存和导出。</p><p class="note">${storageOK?'保存为本浏览器中的设计评审副本；不是产品方案保存。':'浏览器存储不可用；请导出JSON评审副本后用导入重开。'}</p><div class="actions"><button class="primary" data-action="save">保存离线评审方案</button><button data-action="history">重开已保存方案</button><button data-action="csv">导出演示任务CSV</button><button data-action="json">导出演示方案JSON</button></div><p class="small">CSV含未排、检查范围及冻结输入版本。JSON为离线评审可携格式；产品继续使用既有原生导出合同。</p><hr><button disabled>比较 / 主管确认 · 下一阶段 #40 / #41</button><p>共享免登录；没有个人审批签名。</p></div>${footer('work','返回选择，修改后另开计算')}`}
function renderData(){$('#title').textContent='数据与 CSV';$('#view').innerHTML=`<div class="card"><h2>从业务对象找到记录</h2><div class="grid"><div><h3>主数据</h3><button data-edit="machine">设备 MIX02 / 日历编号</button><p>工厂产线 → 设备 → 日历与停机<br>产品 → 路线 → 工序工时<br>工装 / 人员组 / 物理池 / 技能<br>物料 / BOM / 程序与空间</p></div><div><h3>交易数据</h3><button data-edit="order">订单 B / 需求类型补录</button><p>订单 → 产品、产线、数量、交期<br>库存批次 / 到料 / 延期 / 计划供给引用<br>模拟执行事实 / 累计耗料 / 对账</p></div></div><div class="note">完整字段及关系见交付CSV。此原型可操作两类维护返回，其他对象按同一返回契约；CSV原子导入保留既有能力，非本原型实现。</div><button data-action="work">返回原工作步骤</button></div>`}
function renderHistory(){$('#title').textContent='冻结方案';$('#view').innerHTML=`<div class="card"><h2>重开原来的输入和结果</h2>${history.length?history.map((r,i)=>`<article><b>${esc(r.savedId)} · ${esc(r.id)}</b><p>冻结输入 v${r.snapshot.version} · ${r.result.tasks.length} 已排 / ${r.result.unplanned.length} 未排</p><button data-history="${i}">重开冻结方案</button></article>`).join('<hr>'):'<p>尚无离线保存方案；先完成本次小闭环。</p>'}<label>导入已导出的离线评审JSON<input type="file" id="import" accept="application/json,.json"></label><button data-action="current">去当前输入</button><p class="small">本地存储可能受artifact沙箱限制；JSON用于跨打开恢复。不会上传或写入产品。</p></div>`}
function renderRoadmap(){$('#title').textContent='完整能力路线图';$('#view').innerHTML=`<div class="card"><h2>可见的后续路径</h2><p>每项需要原包门槛；没有假可用按钮。</p>${[['UAT03–05条件扩展','#45 / #28–30','同候选复现限定工装/人员/normalized断言'],['UAT06–08工装与人员','#37（#34历史）','B08原任务结论与文件释放'],['UAT05原生及UAT09–11物料','#38','原生映射、单位公式、数据配置及独立预期'],['UAT12–14路线/程序/空间','#39','明确契约；DEC04–06新应用待批'],['UAT15/17/18执行保护与重排','#40','冻结/剩余工作/试算比较边界'],['整体确认/归档/恢复/日志','#41','前序包和具体确认合同；共享访问不伪装个人审批'],['UAT16多线 / P1 / D3','#42 / #43 / #44','专题及接口另授权；B02仍待批']].map(([a,b,c])=>`<article><h3>${a}</h3><p>${b} · ${c}<br>owner：PM协调，Dev/Test实现自测，QA入口就绪受调度。</p><button disabled>尚未开放 · 下一阶段</button></article>`).join('<hr>')}</div>`}
function openEditor(type,trigger){editorType=type;returnFocus=trigger;returnScroll=window.scrollY;dirty=false;let d=$('#editor');
 d.innerHTML=`<h2 id="editorTitle">${type==='machine'?'主数据 · MIX02 · 日历编号':'交易数据 · 订单 B · 需求类型'}</h2><p class="tag">维护当前输入，返回第 ${step+1} 步 · ${stepNames[step]}</p><p>模拟来源 · 当前输入 v${input.version}。关联靠编号；不改变已有运行或历史方案。</p>${type==='machine'?`<label>日历编号（引用 calendars）<select id="editValue"><option value="">请选择，不提供默认值</option><option value="FC01" ${input.calendar==='FC01'?'selected':''}>FC01 · 工厂工作日历 [0,600) min</option></select></label><p class="small">原点 2026-11-02 08:00 +08:00；MIX02 停机 [0,15)，完整30分钟不能跨不可用段。</p>`:`<label>需求类型<select id="editValue"><option value="">请选择，不提供默认值</option><option value="正式订单" ${input.demand==='正式订单'?'selected':''}>正式订单 · 本次显式模拟补录</option></select></label><p class="small">补录 B 的需求类型，已具备模拟有效状态/不拆分；完整R2.1六项逐项来源由产品既有入口承载。保存不等于应用，也不成为所有订单默认。</p>`}<label>来源说明（必填）<input id="editSource" value="本次设计评审显式模拟"></label><label>来源版本（必填）<input id="editVersion" value="MOCK-UIUX-r1"></label><div id="editError" role="alert"></div><div class="actions"><button class="primary" data-action="editsave">${type==='machine'?'保存引用并返回':'保存补录配置并返回'}</button><button data-action="editcancel">取消并返回</button></div>`;
 d.showModal();$('#editValue').focus();
}
function closeEditor(){const t=returnFocus;$('#editor').close();draw();requestAnimationFrame(()=>{if(t?.dataset?.edit)document.querySelector(`[data-edit="${t.dataset.edit}"]`)?.focus();window.scrollTo(0,returnScroll)});say('已返回原步骤，订单选择、范围及任务定位保留。')}
function saveEditor(){const val=$('#editValue').value,source=$('#editSource').value.trim(),v=$('#editVersion').value.trim();if(!val||!source||!v){$('#editError').textContent='请补齐值、来源说明和来源版本；没有写入。';return}if(editorType==='machine'){input.calendar=val;input.calendarSource={source,version:v};mutate()}else{input.demand=val;input.orderSource={source,version:v};input.configVersion++;checked=false}closeEditor()}
function sourceDialog(type){const d=$('#editor'),t=[...run.result.tasks,...run.result.unplanned].find(x=>x.id===selected);returnFocus=document.activeElement;returnScroll=window.scrollY;editorType='source';dirty=false;
 d.innerHTML=`<h2 id="editorTitle">冻结来源 · ${esc(selected)}</h2><p>冻结输入 v${run.snapshot.version}，与当前输入 v${input.version} 分开。只读。</p>${type==='material'?'<div class="note warn">本运行未检查MATERIAL；本夹具没有可追溯物料分配。normalized来源不是原CSV物理行，原生映射见 #38 后续。</div>':`<pre>${esc(JSON.stringify({task:t?.id,table:type==='resource'?'machines':'dependencies',recordKey:type==='resource'?t?.machine:[t?.order,t?.op],field:type==='resource'?'日历编号':'资源编号',value:type==='resource'?run.snapshot.calendar:t?.machine,source:'MOCK-UIUX-r1 / 离线夹具',physicalRow:null,note:'模拟夹具不捏造原CSV物理行'},null,2))}</pre><p>相关任务：${esc(run.result.tasks.filter(x=>x.machine===t?.machine).map(x=>x.id).join('、')||selected)}</p>`}<div class="actions"><button data-action="sourceback">返回同一任务</button><button data-action="sourcecurrent">去当前输入维护（历史保持不变）</button></div>`;d.showModal();d.querySelector('button').focus();}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('已触发浏览器下载；文件为离线设计演示数据。')}
function csvExport(){if(!run?.result)return;const vals=[['design_only','run_id','input_version','task_id','machine','start_minute','end_minute','status','reason','checked','unchecked','time_origin','frozen_input_json']];[...run.result.tasks,...run.result.unplanned].forEach(t=>vals.push(['true',run.id,run.snapshot.version,t.id,t.machine,t.start??'',t.end??'',t.start===null?'UNPLANNED':'PLANNED',t.reason||'',run.result.checked.join('|'),run.result.unchecked.join('|'),'2026-11-02T08:00:00+08:00',JSON.stringify(run.snapshot)]));download('APS-离线演示任务.csv','\ufeff'+vals.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function go(n){if((n===2||n===3)&&(blocks().length||!checked)&&kind!=='history'){say('先完成数据检查和补缺，再进入后续步骤。');step=1;page='work';draw();return}step=n;page='work';draw()}
const actions={
 work(){page='work';if(step===5)step=0;draw()},data(){page='data';draw()},history(){page='history';draw()},roadmap(){page='roadmap';draw()},back(){go(Math.max(0,step-1))},
 check(){step=1;page='work';checked=blocks().length===0;draw();say(checked?'基础数据已检查；高级未启用项仍未检查。':'找到待补项，选择维护入口。')},
 recheck(){checked=blocks().length===0;draw();say(checked?'当前版本基础数据已就绪。':'仍有待补项，请按原因处理。')},
 config(){go(2)},runpage(){go(3)},result(){if(!run?.result){say('本次尚无可用结果，请查看运行状态。');step=3;page='work';draw()}else go(4)},savepage(){go(5)},
 apply(){if(input.demand&&input.configVersion!==input.appliedVersion){input.appliedVersion=input.configVersion;mutate();draw();say('已显式应用B补录到当前输入；请重检，历史未改变。')}},
 submit(){if(blocks().length||!checked||isBusy()||kind==='history'||input.start!=='0'||input.end!=='600'){say('当前不满足演示提交条件。');return}run={id:'DEMO-'+Date.now(),snapshot:clone(input),status:'submitting',phase:'提交中',outcome:scenario,result:null};draw();say('模拟提交中：当前还没有产品受理。')},
 advance(){if(!run)return;const next={submitting:'queued',queued:'running',running:run.outcome,cancel_requested:'cancelled'};run.status=next[run.status]||run.status;run.phase=run.status==='running'?'计算中':run.status==='queued'?'等待线程':'结束';if(['completed','partial','zero'].includes(run.status))run.result=resultFor(run.snapshot,run.status);draw();say('收到演示状态事件：'+statusNames[run.status])},
 cancel(){if(run&&['queued','running'].includes(run.status)){run.status='cancel_requested';run.phase='等待停止确认';draw();say('演示取消请求已发，仍需收到确认。')}},
 disconnect(){if(run){run.lastStatus=run.status;run.status='unknown';run.phase='连接中断';draw()}},recover(){if(run?.status==='unknown'){run.status=run.lastStatus;run.phase=run.status==='running'?'计算中':'等待线程';draw();say('演示恢复同一运行号；未再次提交。')}},
 clearfilter(){filter='全部';draw()},editsave:saveEditor,
 editcancel(){if(!dirty){closeEditor();return}$('#editError').innerHTML='<p>本次维护有未保存修改。</p><button data-action="discard">放弃修改并返回</button> <button data-action="keepedit">继续编辑</button>'},
 discard:closeEditor,keepedit(){$('#editError').textContent='';$('#editValue').focus()},sourceback:closeEditor,
 sourcecurrent(){closeEditor();kind='current';page='work';step=1;draw();say('已切换当前输入；旧结果和历史来源保持冻结。')},
 save(){if(!run?.result)return;const copy=clone(run);copy.savedId='方案-DEMO-'+(history.length+1);history.push(copy);try{localStorage.setItem('aps-uiux-d0-r1',JSON.stringify(history))}catch{storageOK=false}draw();say(storageOK?'已保存本地离线方案，可刷新后重开。':'浏览器存储不可用；此会话保留副本，请导出JSON。')},
 current(){kind='current';page='work';step=0;draw()},
 csv:csvExport,json(){if(run?.result)download('APS-离线演示方案.json',JSON.stringify({schema:'aps-uiux-d0-demo-v1',design_only:true,run:clone(run)},null,2),'application/json')},
 runexport(){if(run)download('APS-离线演示运行.json',JSON.stringify({design_only:true,run:clone(run)},null,2),'application/json')}
};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.step!==undefined){go(Number(b.dataset.step));return}if(b.dataset.edit){if(kind==='history'){say('历史方案只读；请去当前输入维护。');return}openEditor(b.dataset.edit,b);return}if(b.dataset.task){selected=b.dataset.task;draw();say('已定位同一任务 '+selected);return}if(b.dataset.source){sourceDialog(b.dataset.source);return}if(b.dataset.history!==undefined){run=clone(history[Number(b.dataset.history)]);kind='history';page='work';step=4;draw();say('已重开冻结方案；来源和结果保留保存时版本。');return}const fn=actions[b.dataset.action];if(fn)fn()});
document.addEventListener('input',e=>{if(e.target.closest('dialog'))dirty=true;if(e.target.id==='reason'){input.reason=e.target.value;mutate()}if(['start','end'].includes(e.target.id)){input[e.target.id]=e.target.value;mutate()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.order){input.ids=t.checked?[...input.ids,t.dataset.order]:input.ids.filter(o=>o!==t.dataset.order);mutate();draw()}if(['mode','sort'].includes(t.id)){input[t.id]=t.value;mutate();draw()}if(t.id==='filter'){filter=t.value;draw()}if(t.id==='scenario')scenario=t.value;if(t.id==='import'&&t.files[0]){t.files[0].text().then(raw=>{const obj=JSON.parse(raw),r=obj.run;if(obj.schema!=='aps-uiux-d0-demo-v1'||obj.design_only!==true||!r?.snapshot?.ids||!r?.result||!Array.isArray(r.result.tasks)||!Array.isArray(r.result.unplanned)||!Array.isArray(r.result.checked)||!Array.isArray(r.result.unchecked))throw Error('invalid');r.savedId='导入-DEMO-'+(history.length+1);history.push(clone(r));draw();say('已导入离线评审副本。')}).catch(()=>say('导入失败：需要本原型导出的评审JSON；没有写入产品。'))}});
$('#editor').addEventListener('cancel',e=>{e.preventDefault();if(editorType==='source')closeEditor();else actions.editcancel()});
draw();

</script></body></html>
